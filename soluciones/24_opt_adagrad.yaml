# Solución de la práctica 24: AdaGrad sobre el valle elíptico
# GD y AdaGrad usan el mismo learning_rate y max_iterations.
learning_rate: 0.07
max_iterations: 1000
tolerance: 1.0e-6
epsilon: 1.0e-8
w_inicial: [-3.0, 0.4]
threshold: 0.1
max_iterations_cap: 2000
show_animation: true
save_animation: false
animation_path: ../output/adagrad.mp4
save_gd_animation: true
gd_animation_path: ../output/gd_elliptic.mp4
interval: 30
save_plot: true
plot_path: ../output/adagrad.png
